{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vibesort">
  <title>Semantically Ordered Playlist</title>
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="apple-touch-icon" href="{% static 'pages/icon-180.png' %}">
  <link rel="stylesheet" href="{% static 'pages/style.css' %}?v=39">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block page %}
  <main>
    <h1>Semantically Ordered Playlist</h1>
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="{% static 'pages/saved.js' %}?v=2"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("{% url 'service_worker' %}");
    }
  </script>
</body>
</html>
